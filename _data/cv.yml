- title: Open Source Projects
  type: time_table
  contents:
    - title: Bidding Strategy Optimization for Electricity Markets
      institution: Arizona State University, Tempe, AZ, USA
      year: 2022-now
      description: A bidding strategy algorithm for DER aggregators in electricity markets. The algorithm uses an optimization-based model to determine the optimal bidding strategy for DER aggregators with PV and battery storage in the day-ahead and real-time electricity markets. The model has been developed to account for price and resource forecast uncertainity. The model has been developed for the New York Independent System Operator (NYISO) electricity market, and can be adapted to other electricity markets. The model has been implemented in Python using CVXPY and Pyomo optimization libraries. The model has been tested using real-world data from the NYISO electricity market, and the results have been published in a peer-reviewed journal and conference paper. 

